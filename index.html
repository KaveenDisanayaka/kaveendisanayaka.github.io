<!DOCTYPE html>
<html>
<head><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0A84FF"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><title>Uni Planner</title><script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });</script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F2F2F7; --card: rgba(255,255,255,.62); --solid: #FFFFFF; --card2: #F2F2F7; --fill: rgba(120,120,128,.12);
    --label: #000000; --label2: rgba(60,60,67,.60); --label3: rgba(60,60,67,.30); --sep: rgba(60,60,67,.18);
    --blue: #007AFF; --green: #34C759; --red: #FF3B30; --orange: #FF9500; --yellow: #FFCC00;
    --purple: #AF52DE; --pink: #FF2D55; --teal: #30B0C7; --indigo: #5856D6; --gray: #8E8E93;
    --bar: rgba(246,246,248,.66); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.07); --glass-line: rgba(255,255,255,.7);
    --blob1: rgba(10,132,255,.20); --blob2: rgba(175,82,222,.16); --blob3: rgba(52,199,89,.13);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: rgba(36,36,40,.55); --solid: #1C1C1E; --card2: #2C2C2E; --fill: rgba(120,120,128,.24);
      --label: #FFFFFF; --label2: rgba(235,235,245,.60); --label3: rgba(235,235,245,.30); --sep: rgba(84,84,88,.65);
      --blue: #0A84FF; --green: #30D158; --red: #FF453A; --orange: #FF9F0A; --yellow: #FFD60A;
      --purple: #BF5AF2; --pink: #FF375F; --teal: #40C8E0; --indigo: #5E5CE6; --gray: #8E8E93;
      --bar: rgba(18,18,22,.62); --shadow: 0 8px 30px rgba(0,0,0,.25); --glass-line: rgba(255,255,255,.08);
      --blob1: rgba(10,132,255,.30); --blob2: rgba(191,90,242,.24); --blob3: rgba(48,209,88,.14);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--label); }
  body { background: transparent; min-height: 100vh; }
  /* soft colour light behind the glass (like iOS wallpapers) */
  body:before { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background: radial-gradient(38% 28% at 12% 8%, var(--blob1), transparent 70%), radial-gradient(34% 30% at 92% 28%, var(--blob2), transparent 70%),
      radial-gradient(42% 34% at 28% 92%, var(--blob3), transparent 70%), radial-gradient(30% 24% at 85% 85%, var(--blob1), transparent 70%);
    filter: blur(20px); animation: drift 30s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(-3%, 2%, 0) scale(1.06); } }
  /* frosted glass */
  .group, .opt, .rcard, .dlcard, .notebox, .picker, .nta, .drop {
    backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%);
    box-shadow: var(--shadow), inset 0 0 0 .5px var(--glass-line); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 1.29; letter-spacing: -0.2px; -webkit-font-smoothing: antialiased; }
  svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 10; padding: calc(env(safe-area-inset-top) + 10px) 20px 6px;
    background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid transparent; transition: border-color .2s; }
  header.scrolled { border-bottom-color: var(--sep); }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--red); text-transform: uppercase; letter-spacing: .2px; height: 16px; }
  .large { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.15; margin: 2px 0 0; }
  .sub { color: var(--label2); font-size: 13px; margin-top: 2px; min-height: 16px; }

  /* week strip */
  .strip { display: flex; align-items: center; gap: 2px; margin: 12px -8px 4px; }
  .strip .nav { width: 30px; height: 44px; border: 0; background: none; color: var(--blue); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
  .d { text-align: center; cursor: pointer; padding: 2px 0; user-select: none; }
  .d .w { font-size: 11px; font-weight: 600; color: var(--label2); text-transform: uppercase; }
  .d .n { margin: 4px auto 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 500; transition: background .2s, color .2s; }
  .d.today .n { color: var(--red); font-weight: 700; }
  .d.sel .n { background: var(--label); color: var(--bg); font-weight: 700; }
  .d.sel.today .n { background: var(--red); color: #fff; }

  main { padding: 8px 16px calc(env(safe-area-inset-bottom) + 100px); animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .section { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: .1px; margin: 22px 16px 7px; }
  .section.big { text-transform: none; font-size: 22px; font-weight: 700; color: var(--label); letter-spacing: -0.4px; margin: 24px 4px 10px; }

  /* ---------- hero "next up" ---------- */
  .hero { border-radius: 20px; padding: 16px 18px; color: #fff; margin: 8px 0 6px; box-shadow: var(--shadow);
    background: linear-gradient(135deg, #3B82F6 0%, #6366F1 55%, #8B5CF6 100%); position: relative; overflow: hidden; }
  .hero:after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .hero .k { font-size: 13px; font-weight: 600; opacity: .85; text-transform: uppercase; letter-spacing: .3px; }
  .hero .t { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-top: 4px; }
  .hero .m { font-size: 15px; opacity: .92; margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .hero .m span { display: inline-flex; align-items: center; gap: 5px; }
  .hero .m svg.i { width: 16px; height: 16px; }
  .hero.free { background: linear-gradient(135deg, #34C759 0%, #30B0C7 100%); }
  .hero.holiday { background: linear-gradient(135deg, #FF9500 0%, #FF2D55 100%); }

  /* ---------- grouped list ---------- */
  .group { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; position: relative; cursor: default; transition: background .15s; }
  .row + .row:before { content: ""; position: absolute; top: 0; left: 62px; right: 0; border-top: .5px solid var(--sep); }
  .row:active { background: var(--fill); }
  .tile { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; margin-top: 1px; }
  .tile svg.i { width: 20px; height: 20px; stroke-width: 2; }
  .content { flex: 1; min-width: 0; }
  .ttl { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; word-wrap: break-word; }
  .meta { color: var(--label2); font-size: 15px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .meta svg.i { width: 15px; height: 15px; }
  .note { color: var(--label2); font-size: 14px; margin-top: 4px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--label2); }
  .pill.green { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
  .pill.red { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
  .pill.orange { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .done .ttl { color: var(--label2); text-decoration: line-through; text-decoration-color: var(--label3); }
  .cancelled .ttl { text-decoration: line-through; color: var(--label2); }
  .timecol { flex: none; width: 58px; text-align: right; font-size: 14px; color: var(--label2); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .timecol b { display: block; color: var(--label); font-size: 15px; font-weight: 600; }

  /* round check like Reminders */
  .chk { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--label3); flex: none; margin-top: 6px; display: grid; place-items: center;
    cursor: pointer; transition: all .2s cubic-bezier(.2,.9,.3,1.3); background: none; padding: 0; }
  .chk svg.i { width: 15px; height: 15px; stroke: #fff; stroke-width: 3; opacity: 0; transform: scale(.4); transition: all .2s; }
  .chk.on { background: var(--blue); border-color: var(--blue); }
  .chk.on svg.i { opacity: 1; transform: none; }

  /* ---------- buttons ---------- */
  button { font: inherit; cursor: pointer; }
  .btn { border: 0; border-radius: 12px; padding: 14px 18px; font-size: 17px; font-weight: 600; background: var(--blue); color: #fff; width: 100%;
    transition: transform .12s, opacity .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; }
  .btn.tinted { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
  .btn.gray { background: var(--fill); color: var(--label); }
  .btn.small { width: auto; padding: 7px 14px; font-size: 15px; border-radius: 999px; }
  .btn.red { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .btn.grad { background: linear-gradient(135deg, #0A84FF, #5E5CE6); box-shadow: 0 6px 18px rgba(10,132,255,.32); }

  /* ---------- form ---------- */
  .field { display: flex; align-items: center; gap: 12px; padding: 11px 14px; position: relative; min-height: 50px; }
  .field + .field:before { content: ""; position: absolute; top: 0; left: 62px; right: 0; border-top: .5px solid var(--sep); }
  .field label { flex: 1; font-size: 17px; }
  .field input, .field textarea { border: 0; background: none; color: var(--label); font: inherit; outline: none; width: 100%; }
  .dbox { position: relative; display: inline-flex; align-items: center; justify-content: flex-end; flex: 0 0 auto; min-width: 96px;
    color: var(--blue); background: var(--fill); border-radius: 8px; padding: 0 10px; height: 34px; box-sizing: border-box; overflow: hidden; font-size: 16px; white-space: nowrap; }
  .dbox.blank { color: var(--label2); }
  .dbox > input { position: absolute !important; inset: 0; width: 100% !important; height: 34px !important; min-height: 0 !important; opacity: 0; margin: 0; padding: 0 !important; cursor: pointer; }
  .field input[type=date], .field input[type=time] { width: auto; text-align: right; color: var(--blue); background: var(--fill); border-radius: 8px; padding: 6px 10px; font-size: 16px; }
  .field textarea { min-height: 60px; resize: none; padding-top: 2px; }
  .bigin { font-size: 22px !important; font-weight: 600; letter-spacing: -0.4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 14px 14px 62px; }
  .chip { border: 0; background: var(--fill); color: var(--label); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
  .chip svg.i { width: 16px; height: 16px; }
  .chip.on { background: var(--blue); color: #fff; font-weight: 600; }
  .hint { color: var(--label2); font-size: 13px; margin: 8px 16px 0; }

  /* ---------- suggestion cards ---------- */
  .opt { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 2px solid transparent; animation: fade .3s ease both; }
  .opt.best { border-color: var(--blue); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px; }
  .badge svg.i { width: 14px; height: 14px; fill: var(--blue); stroke: var(--blue); }
  .opt .day { font-size: 15px; color: var(--label2); font-weight: 600; }
  .opt .time { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; margin: 2px 0 8px; }
  .why { list-style: none; padding: 0; margin: 0 0 14px; }
  .why li { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--label2); margin: 4px 0; }
  .why svg.i { width: 16px; height: 16px; color: var(--green); stroke-width: 2.4; }

  /* ---------- tab bar ---------- */
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px);
    background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); }
  nav button { flex: 1; border: 0; background: none; color: var(--gray); font-size: 10px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; padding: 2px 0; }
  nav button svg.i { width: 26px; height: 26px; stroke-width: 1.7; }
  nav button.on { color: var(--blue); }
  nav button.on svg.i { stroke-width: 2.2; }
  nav .plus { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #0A84FF, #5E5CE6); color: #fff; display: grid; place-items: center;
    margin-top: -14px; box-shadow: 0 6px 16px rgba(10,132,255,.4); }
  nav .plus svg.i { width: 24px; height: 24px; stroke-width: 2.6; }
  nav .count { position: absolute; top: -2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff;
    font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; }

  /* ---------- sheet + toast ---------- */
  .sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.25); display: none; align-items: flex-end; animation: fade .2s; }
  .sheet .panel { width: 100%; max-height: 88vh; overflow: auto; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border-radius: 16px 16px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px);
    animation: up .32s cubic-bezier(.2,.9,.3,1); }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 4px auto 12px; }
  .sheet h3 { font-size: 20px; font-weight: 700; margin: 4px 0 12px; letter-spacing: -0.4px; }
  .success { text-align: center; padding: 12px 8px 4px; }
  .ring { width: 84px; height: 84px; border-radius: 50%; background: var(--green); margin: 8px auto 14px; display: grid; place-items: center; animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
  .ring svg.i { width: 44px; height: 44px; stroke: #fff; stroke-width: 3; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .success .t { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
  .success .s { color: var(--label2); margin: 6px 0 18px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translateX(-50%); z-index: 50; background: var(--card2);
    color: var(--label); padding: 11px 18px; border-radius: 14px; font-size: 15px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,.18); display: none; max-width: 88%; text-align: center; }
  .warn { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .empty { text-align: center; color: var(--label2); padding: 34px 20px; }
  .empty .bigicon { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 12px; display: grid; place-items: center; background: var(--fill); color: var(--label2); }
  .empty .bigicon svg.i { width: 32px; height: 32px; }
  .skel { height: 64px; border-radius: 14px; background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; margin-bottom: 10px; }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  a { color: var(--blue); text-decoration: none; word-break: break-all; }
  /* segmented control */
  .segctl { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; margin: 4px 0 6px; }
  .segctl button { flex: 1; border: 0; background: none; color: var(--label); font-size: 15px; font-weight: 500; padding: 8px 6px; border-radius: 8px; transition: all .2s; }
  .segctl button.on { background: var(--solid); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .segctl button:not(.on) { color: var(--label2); }
  @media (prefers-color-scheme: dark) { .segctl button.on { background: #636366; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); } }
  .value { color: var(--label2); font-size: 17px; display: inline-flex; align-items: center; gap: 2px; }
  .value svg.i { width: 16px; height: 16px; color: var(--label3); }
  .tap { cursor: pointer; }
  /* wheel picker (like a timer) */
  .wheel { position: relative; height: 220px; display: flex; justify-content: center; gap: 6px; margin: 4px 0 18px; }
  .wheel .band { position: absolute; left: 16px; right: 16px; top: 88px; height: 44px; border-radius: 10px; background: var(--fill); pointer-events: none; }
  .wheel .col { position: relative; z-index: 1; width: 130px; height: 220px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
  .wheel .col::-webkit-scrollbar { display: none; }
  .wheel .col div { height: 44px; line-height: 44px; scroll-snap-align: center; text-align: center; font-size: 23px; font-variant-numeric: tabular-nums; }
  .wheel .col .pad { scroll-snap-align: none; }
  /* repeat picker */
  .opts .row { cursor: pointer; align-items: center; min-height: 48px; }
  .opts .row + .row:before { left: 16px; }
  .tickmark { color: var(--blue); visibility: hidden; }
  .tickmark svg.i { width: 20px; height: 20px; stroke-width: 2.6; }
  .opts .row.sel .tickmark { visibility: visible; }
  .stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 9px; }
  .stepper button { border: 0; background: none; color: var(--label); width: 40px; height: 34px; font-size: 22px; }
  .stepper b { min-width: 34px; text-align: center; font-size: 17px; }
  .wd { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; }
  .wd button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label); font-weight: 600; font-size: 15px; transition: all .15s; }
  .wd button.on { background: var(--blue); color: #fff; }
  .summary { background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); border-radius: 12px; padding: 11px 14px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .summary svg.i { width: 18px; height: 18px; }
  /* ---------- Calendar tab (iOS Calendar style) ---------- */
  .calnav { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .calnav .segctl { flex: 1; margin: 0; }
  .calnav .nav { width: 34px; height: 34px; border: 0; background: var(--fill); border-radius: 50%; color: var(--blue); display: grid; place-items: center; padding: 0; }
  .calnav .nav svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
  .dhead { display: flex; margin: 10px -20px 0; padding: 0 0 6px; }
  .dhead .g { width: 46px; flex: none; }
  .dhead .c { flex: 1; text-align: center; cursor: pointer; min-width: 0; }
  .dhead .w { font-size: 11px; color: var(--label2); font-weight: 600; text-transform: uppercase; }
  .dhead .n { margin: 3px auto 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 500; }
  .dhead .c.today .n { background: var(--red); color: #fff; font-weight: 700; }
  .allday { display: flex; margin: 0 -16px 6px; }
  .allday .g { width: 46px; flex: none; font-size: 10px; color: var(--label2); text-align: right; padding: 4px 6px 0 0; }
  .allday .c { flex: 1; min-width: 0; padding: 0 1px; }
  .adchip { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 5px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .tgrid { position: relative; display: flex; margin: 0 -16px; }
  .tgrid .gut { width: 46px; flex: none; position: relative; }
  .tgrid .gut span { position: absolute; right: 6px; font-size: 11px; color: var(--label2); transform: translateY(-7px); font-variant-numeric: tabular-nums; }
  .tgrid .col { flex: 1; position: relative; min-width: 0; border-left: .5px solid var(--sep); cursor: pointer;
    background-image: linear-gradient(var(--sep) .5px, transparent .5px); }
  .tgrid .col.today { background-color: color-mix(in srgb, var(--blue) 4%, transparent); }
  .blk { position: absolute; border-radius: 6px; padding: 3px 5px; overflow: hidden; cursor: pointer; border-left: 3px solid; font-size: 12px; line-height: 1.2; box-sizing: border-box; }
  .blk b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .blk span { opacity: .85; font-size: 11px; }

function wheelCol(id, values, label, sel) {

var HOURS = []; for (var hh = 0; hh <= 16; hh++) HOURS.push(hh);
var MINS = []; for (var mm = 0; mm < 60; mm += 5) MINS.push(mm);

    '<button class="btn" onclick="setWheel()">Set ' + '<span id="whTxt">' + durText(m) + '</span></button>');
  var h = $('wh-h'), mi = $('wh-m');

  h.addEventListener('scroll', upd); mi.addEventListener('scroll', upd);
}
function wheelVal() {
  var h = HOURS[Math.max(0, Math.min(HOURS.length - 1, Math.round($('wh-h').scrollTop / 44)))];

}
function setWheel() {

function presetOf(r) {

}
function drawRepeat() {
  var p = presetOf(rp);
  var PRE = [['none', 'Never'], ['day', 'Every day'], ['week', 'Every week'], ['2week', 'Every 2 weeks'], ['month', 'Every month'], ['custom', 'Custom…']];
  var unit = { daily: 'Days', weekly: 'Weeks', monthly: 'Months' };

    '<div class="group opts">' + PRE.map(function (o) {

      '<div class="segctl" style="margin:12px 0 0">' + ['daily', 'weekly', 'monthly'].map(function (f) {
          return '<button class="' + (rp.freq === f ? 'on' : '') + '" onclick="rpFreq(\'' + f + '\')">' + unit[f] + '</button>'; }).join('') + '</div>' +
      (rp.freq === 'weekly' ? '<div class="hint" style="margin:14px 0 6px">On these days</div><div class="wd">' +
        [1, 2, 3, 4, 5, 6, 0].map(function (d) { return '<button class="' + (rp.days.indexOf(d) >= 0 ? 'on' : '') + '" onclick="rpDay(' + d + ')">' + SD[d].slice(0, 1) + '</button>'; }).join('') + '</div>' : '') +
      '</div>';

    h += '<div class="section">Ends</div><div class="group" style="padding:12px 14px"><div class="segctl" style="margin:0">' +
      [['never', 'Never'], ['until', 'On a date'], ['count', 'After']].map(function (e) {
        return '<button class="' + (rp.end.type === e[0] ? 'on' : '') + '" onclick="rpEnd(\'' + e[0] + '\')">' + e[1] + '</button>'; }).join('') + '</div>' +
      (rp.end.type === 'until' ? '<div class="field" style="padding:12px 0 0"><label>Last day</label><input type="date" value="' + esc(rp.end.until || '') + '" onchange="rp.end.until=this.value;drawRepeat()"></div>' : '') +
      (rp.end.type === 'count' ? '<div class="field" style="padding:12px 0 0"><label>Number of times</label><span class="stepper"><button onclick="rpCount(-1)">−</button><b>' + rp.end.count +

function preset(k) {

function readPicked(f, send) {
  var rd = new FileReader();
  if (/^image\//.test(f.type)) {
    // make big phone photos smaller first (faster, and clear enough for reading)
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 2200 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);

        send(cv.toDataURL('image/jpeg', 0.88).split(',')[1], 'image/jpeg');

      img.src = rd.result;

      '<button class="btn small red" onclick="rsDelete(' + i + ')">Delete</button><button class="btn small gray" onclick="rsKeep(' + i + ')">Keep both</button></div>';

function openEvPage(id, date) {

  state.view = 'event'; setNav('');
  if (window.__cdTimer) { clearInterval(window.__cdTimer); window.__cdTimer = null; }
  closeSheet(); closeDrawer(); window.scrollTo(0, 0);
  header('', '…', '', false);

}
function goBack() { var v = state.prevView || 'today'; state.view = ''; show(v); }
function drawEvPage() {
  var r = state.noteCtx, e = r.event, k = kindOf({ title: e.rawTitle, type: e.type, notes: e.notes, color: e.color, start: e.start, end: e.end });
  var moment = e.start && e.start === e.end;
  var when = e.allDay ? 'All day' : moment ? 'Due ' + ampm(e.start) : ampm(e.start) + ' – ' + ampm(e.end);
  header((e.code ? e.code + ' · ' : '') + (e.own ? (moment ? 'My deadline' : 'My task') : e.type || 'Event'), cleanTitle(e.rawTitle), '', false);
  $('eyebrow').style.height = 'auto';
  $('eyebrow').innerHTML = '<div onclick="goBack()" style="cursor:pointer;color:var(--blue);text-transform:none;font-size:17px;font-weight:400;display:inline-flex;align-items:center;gap:2px;margin:0 0 6px -6px">' + icon('left') + 'Back</div>' +
    '<div>' + esc((e.code ? e.code + ' · ' : '') + (e.own ? (moment ? 'My deadline' : 'My task') : e.type || 'Event')) + '</div>';
  $('hsub').innerHTML = '';
  $('hextra').innerHTML = '<div class="evhead"><div class="tile" style="background:' + k.c + '">' + icon(k.i) + '</div><div>' +
    '<div class="meta"><span>' + icon('calendar') + esc(nice(e.date, true)) + '</span></div>' +
    '<div class="meta"><span>' + icon('clock') + esc(when) + '</span>' + (e.repeating ? '<span>' + icon('repeat') + esc(e.repeatText) + '</span>' : '') + '</div>' +
    (e.venue ? '<div class="meta"><span>' + icon('pin') + esc(e.venue) + '</span></div>' : '') + '</div></div>';
  var pills = [];
  if (e.status === 'cancelled') pills.push('<span class="pill red">Cancelled</span>');
  if (e.color === '10') pills.push('<span class="pill green">Submitted</span>');
  if (r.past) pills.push('<span class="pill">Finished</span>');
  var info = e.notes.split('\n').filter(function (l) { return l && !/^Kind: |^Status: /.test(l); }).join('\n');
  var h = (pills.length ? '<div class="pills" style="margin:4px 0 8px">' + pills.join('') + '</div>' : '');
  if (e.timeEditable) {
    h += '<div class="section">Time</div><div class="group">' +
      '<div class="field"><div class="tile" style="background:var(--red)">' + icon('calendar') + '</div><label>Date</label>' +
        (e.own ? '<input id="pg-date" type="date" value="' + esc(e.date) + '" onchange="pgDirty()">' : '<span class="value">' + esc(nice(e.date)) + '</span>') + '</div>' +
      '<div class="field"><div class="tile" style="background:var(--indigo)">' + icon('clock') + '</div><label>' + (moment ? 'Due at' : 'Starts') + '</label><input id="pg-s" type="time" value="' + esc(e.start) + '" onchange="pgDirty()"></div>' +
      (moment ? '' : '<div class="field"><div class="tile" style="background:var(--orange)">' + icon('timer') + '</div><label>Ends</label><input id="pg-e" type="time" value="' + esc(e.end) + '" onchange="pgDirty()"></div>' +
        '<div class="seg" style="padding:2px 14px 12px 62px"><button class="chip" onclick="pgExtend(15)">+15 min</button><button class="chip" onclick="pgExtend(30)">+30 min</button><button class="chip" onclick="pgExtend(60)">+1 hr</button></div>') +
      '</div>' +
      '<div id="pg-savebar" style="display:none;margin-top:10px"><button class="btn" id="pg-save" onclick="pgSaveTime()">Save time</button></div>' +

  } else if (e.repeating) {

  if (info) h += '<div class="section">Details</div><div class="group" style="padding:12px 14px"><div class="note" style="margin:0;white-space:pre-line">' + esc(info) + '</div>' +
    (e.source && !e.own ? '<div class="note" style="font-size:12px;margin-top:8px">From: ' + esc(e.source) + '</div>' : '') + '</div>';
  h += '<div id="evnotes" style="margin-top:6px"></div><div id="pg-actions" style="margin-top:22px;display:flex;flex-direction:column;gap:10px"></div>';
  $('main').innerHTML = h;

  var a = '';

function cdInfo(ms, submitted) {

  var t = d > 0 ? d + 'd ' + h + 'h ' + m + 'm' : h > 0 ? h + 'h ' + m + 'm ' + String(sec).padStart(2, '0') + 's' : m + 'm ' + String(sec).padStart(2, '0') + 's';

}
function dlKind(x) {

function dlHue(ms) {   // far away = blue, close = red

}
function openExam(i) {
  var x = state.exams.exams[i], c = cdInfo(x.dueMs, false);
  openSheet('<div style="display:flex;gap:12px;align-items:flex-start"><div class="tile" style="background:' + moduleColor(x.code) + ';width:44px;height:44px;border-radius:11px">' + icon('exam') + '</div>' +
    '<div><h3 style="margin:2px 0 4px">' + esc(cleanTitle(x.title)) + '</h3><div class="meta"><span>' + icon('calendar') + esc(nice(x.date, true)) + ' · ' + esc(ampm(x.start)) + ' – ' + esc(ampm(x.end)) + '</span></div>' +
    (x.venue ? '<div class="meta"><span>' + icon('pin') + esc(x.venue) + '</span></div>' : '') + '</div></div>' +
    '<div class="bigcd cd ' + c.c + '">' + esc(c.t) + '</div><div class="note" style="margin:0 0 14px">until the exam starts</div>' +
    '<button class="btn grad" onclick="revisionForm(' + i + ')">' + icon('sparkle') + (x.revision ? 'Make a new revision plan' : 'Make a revision plan') + '</button><div style="height:10px"></div>' +
    (x.revision ? '<button class="btn tinted" onclick="closeSheet();state.sub={view:\'modules\',when:\'upcoming\',module:\'' + x.code + '\'};show(\'subjects\')">See revision sessions</button><div style="height:10px"></div>' : '') +
    '<button class="btn gray" style="color:var(--red)" onclick="removeExam(' + i + ')">Remove exam</button>' +
    '<div id="evnotes" style="margin-top:18px"><div class="skel" style="height:60px"></div></div>');
  loadEvNotes(x.id, x.date);
}
function removeExam(i) {
  var x = state.exams.exams[i];
  confirmSheet('Remove this exam?', 'Its future revision sessions are removed too.', 'Remove', function () {
    call('appRemoveExam', x.id).then(function () { toast('Removed'); loadExams(); }).catch(function (e) { toast(e.message || e); });
  });
}
function revisionForm(i) {
  var x = state.exams.exams[i], days = Math.max(1, Math.round((Date.parse(x.date + 'T00:00:00Z') - Date.parse((state.today || x.date) + 'T00:00:00Z')) / 86400000));
  state.rev = { i: i, sessions: Math.min(6, days), hours: 2 };
  drawRevisionForm();
}
function drawRevisionForm() {
  var R = state.rev, x = state.exams.exams[R.i];
  openSheet('<h3>Revision plan</h3><div class="hint" style="margin:-6px 0 12px">' + esc(cleanTitle(x.title)) + ' · ' + esc(nice(x.date)) + ' (' + esc(inDays(x.date)) + ')</div>' +
    '<div class="group" style="padding:12px 14px"><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:17px">Sessions</span>' +
      '<span class="stepper"><button onclick="state.rev.sessions=Math.max(1,state.rev.sessions-1);drawRevisionForm()">−</button><b>' + R.sessions + '</b><button onclick="state.rev.sessions=Math.min(30,state.rev.sessions+1);drawRevisionForm()">+</button></span></div>' +
      '<div class="hint" style="margin:12px 0 6px">Each session</div><div class="seg" style="padding:0">' + [[1, '1 hr'], [1.5, '1 hr 30 min'], [2, '2 hr'], [3, '3 hr']].map(function (h) {
        return '<button class="chip' + (R.hours === h[0] ? ' on' : '') + '" onclick="state.rev.hours=' + h[0] + ';drawRevisionForm()">' + h[1] + '</button>'; }).join('') + '</div></div>' +
    '<div class="hint" style="margin:10px 4px 14px">I spread the sessions over the days before the exam, in your free time (' + (R.sessions * R.hours) + ' hours in total).</div>' +
    '<button class="btn grad" id="revbtn" onclick="makeRevision()">' + icon('sparkle') + 'Make the plan</button>');
}
function makeRevision() {
  var R = state.rev, x = state.exams.exams[R.i], b = $('revbtn'); b.disabled = true; b.textContent = 'Planning…';
  call('appRevisionPlan', x.id, { sessions: R.sessions, hours: R.hours }).then(function (p) { state.revPlan = p; drawRevisionPlan(); })
    .catch(function (e) { b.disabled = false; b.textContent = 'Try again'; toast(e.message || e); });
}
function drawRevisionPlan() {
  var p = state.revPlan, n = p.sessions.filter(function (s) { return s.on; }).length;
  openSheet('<h3>Your revision plan</h3><div class="hint" style="margin:-6px 0 12px">' + esc(cleanTitle(p.exam.title)) + ' · ' + esc(nice(p.exam.date)) + '</div>' +
    (p.sessions.length ? '<div class="group">' + p.sessions.map(function (s, i) {
      return '<div class="row' + (s.on ? '' : ' off') + '" style="align-items:center"><div class="tile" style="background:var(--blue)">' + icon('book') + '</div><div class="content">' +
        '<div class="ttl">' + (i + 1) + '. ' + esc(nice(s.date)) + '</div><div class="meta"><span>' + icon('clock') + esc(ampm(s.start)) + ' – ' + esc(ampm(s.end)) + '</span></div></div>' +
        '<button class="sw' + (s.on ? ' on' : '') + '" onclick="state.revPlan.sessions[' + i + '].on=!state.revPlan.sessions[' + i + '].on;drawRevisionPlan()" aria-label="add"></button></div>';
    }).join('') + '</div>' : '') +
    (p.missed ? '<div class="warn" style="margin-top:10px">' + p.missed + ' session(s) did not fit: there is not enough free time. Try shorter sessions.</div>' : '') +
    (p.existing ? '<div class="hint" style="margin:10px 4px 0">This replaces your ' + p.existing + ' old revision session(s) that are still to come.</div>' : '') +
    '<div style="margin-top:14px"><button class="btn grad" id="revsave"' + (n ? '' : ' disabled') + ' onclick="saveRevision()">' + icon('check') + 'Add ' + n + (n === 1 ? ' session' : ' sessions') + '</button></div>' +
    '<div style="height:10px"></div><button class="btn gray" onclick="drawRevisionForm()">Change</button>');
}
function saveRevision() {
  var p = state.revPlan, b = $('revsave'); b.disabled = true; b.textContent = 'Adding…';
  call('appRevisionSave', p.exam.id, p.sessions.filter(function (s) { return s.on; }), p.existing > 0).then(function (r) {
    closeSheet(); toast(r.added + ' revision sessions added ✓'); loadExams();
  }).catch(function (e) { b.disabled = false; b.textContent = 'Try again'; toast(e.message || e); });
}
function addExamForm() {
  var mods = (state.exams && state.exams.modules || []).map(function (c) { return '<option>' + c + '</option>'; }).join('');
  openSheet('<h3>Add an exam</h3><div class="group">' +
    '<div class="field"><div class="tile" style="background:var(--indigo)">' + icon('lecture') + '</div><label>Module</label><select id="x-code">' + mods + '</select></div>' +
    '<div class="field"><div class="tile" style="background:var(--red)">' + icon('calendar') + '</div><label>Date</label><input id="x-edate" type="date"></div>' +
    '<div class="field"><div class="tile" style="background:var(--indigo)">' + icon('clock') + '</div><label>Starts</label><input id="x-es" type="time" value="09:00"></div>' +
    '<div class="field"><div class="tile" style="background:var(--orange)">' + icon('clock') + '</div><label>Ends</label><input id="x-ee" type="time" value="12:00"></div>' +
    '<div class="field"><div class="tile" style="background:var(--green)">' + icon('pin') + '</div><input id="x-ev" placeholder="Hall (optional)"></div></div>' +
    '<div style="margin-top:14px"><button class="btn" id="x-save">Add exam</button></div>');
  $('x-save').onclick = function () {
    var x = { code: $('x-code').value, date: $('x-edate').value, start: $('x-es').value, end: $('x-ee').value, venue: $('x-ev').value.trim() };
    if (!x.code || !x.date || !x.start) { toast('Choose the module, date and time'); return; }
    call('appAddExam', x).then(function () { closeSheet(); toast('Exam added ✓'); loadExams(); }).catch(function (e) { toast(e.message || e); });
  };
}
function openExamImport() {
  header('EXAMS', 'Import exam timetable', 'From a PDF or a photo', false);
  $('main').innerHTML = '<div class="drop"><div class="bigicon" style="background:var(--purple)">' + icon('exam') + '</div>' +
    '<div class="ttl" style="font-size:19px">Choose the exam timetable</div><div class="note" style="margin:6px 0 16px">The PDF from the faculty, or a clear photo of it.</div>' +
    '<label class="btn grad" style="display:inline-flex;width:auto;padding:13px 24px">' + icon('upload') + 'Choose PDF or photo' +
    '<input type="file" accept="application/pdf,image/*" style="display:none" onchange="examPicked(this)"></label>' +
    '<ul class="bul"><li>' + icon('check') + 'Only the modules you are enrolled in on Moodle</li><li>' + icon('check') + 'You check every exam before it is added</li></ul></div>' +
    '<div style="margin-top:16px"><button class="btn gray" onclick="loadExams()">Back</button></div>';
}
function examPicked(input) {
  var f = input.files && input.files[0]; if (!f) return;
  $('main').innerHTML = '<div class="reading"><div class="spinner"></div><div class="ttl">Reading the exam timetable…</div><div class="note" style="margin-top:6px">' + esc(f.name) + '<br>This takes about 20 seconds.</div></div>';
  readPicked(f, function (b64, mime) {
    call('appExamPreview', b64, mime).then(function (r) { r.exams.forEach(function (e) { e.on = e.ok; }); state.examImp = r; drawExamReview(); })
      .catch(function (e) { $('main').innerHTML = '<div class="warn">' + esc(e.message || e) + '</div><div style="margin-top:14px"><button class="btn" onclick="openExamImport()">Try again</button></div>'; });
  });
}
function drawExamReview() {
  var r = state.examImp, n = r.exams.filter(function (e) { return e.on; }).length;
  header('CHECK BEFORE ADDING', 'Your exams', '', false);
  $('main').innerHTML = (r.note ? '<div class="warn" style="margin-bottom:10px">' + esc(r.note) + '</div>' : '') + '<div class="group">' + r.exams.map(function (e, i) {
    return '<div class="row' + (e.on ? '' : ' off') + '" style="align-items:center"><div class="tile" style="background:' + moduleColor(e.code) + '">' + icon('exam') + '</div><div class="content">' +
      '<div class="ttl">' + esc(e.code) + (e.name ? ' · ' + esc(e.name) : '') + '</div>' +
      (e.ok ? '<div class="meta"><span>' + esc(nice(e.date)) + ' · ' + esc(ampm(e.start)) + ' – ' + esc(ampm(e.end)) + '</span>' + (e.venue ? '<span>' + icon('pin') + esc(e.venue) + '</span>' : '') + '</div>'
        : '<div class="meta" style="color:var(--orange)">Not clear: ' + esc(e.raw) + ' — add it by hand</div>') + '</div>' +
      (e.ok ? '<button class="sw' + (e.on ? ' on' : '') + '" onclick="state.examImp.exams[' + i + '].on=!state.examImp.exams[' + i + '].on;drawExamReview()"></button>' : '') + '</div>';
  }).join('') + '</div>' +
    (r.others.length ? '<div class="hint" style="margin:10px 4px 0">Not your modules (skipped): ' + esc(r.others.join(', ')) + '</div>' : '') +
    '<div style="margin-top:20px"><button class="btn grad" id="exsave"' + (n ? '' : ' disabled') + ' onclick="saveExams()">' + icon('check') + 'Add ' + n + (n === 1 ? ' exam' : ' exams') + '</button></div>';
}
function saveExams() {
  var b = $('exsave'); b.disabled = true; b.textContent = 'Adding…';
  call('appExamSave', { exams: state.examImp.exams.filter(function (e) { return e.on; }) }).then(function (r) { toast(r.added + ' exams added ✓'); loadExams(); })
    .catch(function (e) { b.disabled = false; b.textContent = 'Try again'; toast(e.message || e); });
}

// ---------------- Updates ----------------
function updKind(m) {
  if (/^⚠️/.test(m)) return { i: 'alert', c: 'var(--orange)' };
  if (/^❌/.test(m)) return { i: 'x', c: 'var(--red)' };
  if (/^🔔/.test(m)) return { i: 'bell', c: 'var(--blue)' };
  if (/^📌/.test(m)) return { i: 'doc', c: 'var(--red)' };
  if (/^📝/.test(m)) return { i: 'pencil', c: 'var(--purple)' };
  if (/^🧪/.test(m)) return { i: 'flask', c: 'var(--teal)' };
  if (/^🏖️/.test(m)) return { i: 'sun', c: 'var(--orange)' };
  if (/^❓/.test(m)) return { i: 'question', c: 'var(--orange)' };
  if (/^✳️|^✅/.test(m)) return { i: 'check', c: 'var(--green)' };
  return { i: 'bell', c: 'var(--gray)' };
}
function loadUpdates() {
  header('ACTIVITY', 'Updates', 'Questions for you, then what changed', false);
  $('main').innerHTML = skeleton(4);
  Promise.all([call('appQuestions'), call('appUpdates')]).then(function (rr) {
    var qs = rr[0], list = rr[1];
    count(qs.filter(function (q) { return q.yesNo; }).length);
    var qh = qs.length ? '<div class="section" style="color:var(--orange)">Needs your answer (' + qs.length + ')</div>' + questionsHtml(qs) : '';
    if (!list.length) { $('main').innerHTML = qh + '<div class="empty"><div class="bigicon">' + icon('bell') + '</div><b>No updates yet</b></div>'; return; }
    $('main').innerHTML = qh + (qs.length ? '<div class="section">What changed</div>' : '') + '<div class="group">' + list.map(function (n) {
      var k = updKind(n.message), msg = n.message.replace(/^[^A-Za-z0-9"'(]+\s*/, '');
      return '<div class="row"><div class="tile" style="background:' + k.c + '">' + icon(k.i) + '</div><div class="content">' +
        '<div style="font-size:15px">' + esc(msg) + '</div><div class="note">' + esc(n.time) + '</div></div></div>';
    }).join('') + '</div>';
  }).catch(fail);
}

if (IN_GOOGLE) show('today');
else takeSetupLink().then(function (linked) {
  if (linked === 'failed') return;
  loadDev().then(function (d) { if (d) startApp(linked === true); else drawSetup(); });
});
</script>
